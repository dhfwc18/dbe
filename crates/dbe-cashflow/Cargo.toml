[package]
name = "dbe-cashflow"
version = "0.1.1"
edition = "2024"
description = "Core discounted-cashflow utilities for present-value analysis."
license-file = "../../LICENSE.txt"
readme = "README.md"
repository = "https://github.com/dhfwc18/dbe"
homepage = "https://github.com/dhfwc18/dbe"
documentation = "https://docs.rs/dbe-cashflow"
keywords = ["economics", "finance", "cashflow", "discounting"]
categories = ["finance"]

[dependencies]
sobol_burley = "0.5.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
crate-type = ["rlib"]

[[bench]]
name = "pv_bench"
harness = false
