[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dbe"
version = "0.1.0"
description = "Collection of basic economic functionalities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "David Huang" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/dhfwc18/dbe"
Repository = "https://github.com/dhfwc18/dbe"
Issues = "https://github.com/dhfwc18/dbe/issues"

[tool.maturin]
python-source = "src"
module-name = "dbe._core"
features = ["pyo3/extension-module"]
manifest-path = "../crates/dbe-python/Cargo.toml"

[tool.pytest]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]
