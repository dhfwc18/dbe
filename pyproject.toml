[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pydbe"
version = "0.1.0"
description = "Collection of basic economic functionalities."
requires-python = ">=3.13"

[tool.maturin]
python-source = "pydbe"
module-name = "._core"
features = ["pyo3/extension-module"]

[tool.pytest]
testpaths = ["pydbe_tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
    "pytest>=9.0.2",
]
